name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-legacy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mc-version:
          - '1.21.5'
          - '1.21.8'
          - '1.21.10'
          - '1.21.11'
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build JAR with Gradle
        run: ./gradlew -PpaperApiVersion=${{ matrix.mc-version }}-R0.1-SNAPSHOT assemble
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mc-version:
          - '26.2'
          - '26.3'
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build JAR with Gradle
        run: ./gradlew -PpaperApiVersion="${{ matrix.mc-version }}.build.+" assemble
